<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Plume logo: a capped game controller mascot">
  <defs>
    <clipPath id="plumeCapClip">
      <path d="M 60 92
               C 55 50, 90 18, 132 20
               C 168 22, 196 46, 204 78
               L 172 88
               C 148 78, 118 76, 92 82
               C 80 85, 69 88, 60 92 Z"/>
    </clipPath>
  </defs>

  <!-- controller body -->
  <path d="M 120 96
           C 112 82, 100 74, 87 74
           C 68 74, 54 88, 54 108
           C 54 112, 54.5 116, 55.5 120
           C 40 128, 28 144, 24 164
           C 19 189, 33 210, 55 212
           C 74 214, 90 200, 98 178
           C 103 164, 108 154, 120 154
           C 132 154, 137 164, 142 178
           C 150 200, 166 214, 185 212
           C 207 210, 221 189, 216 164
           C 212 144, 200 128, 185 120
           C 186 116, 186.5 112, 186.5 108
           C 186.5 88, 172 74, 153 74
           C 140 74, 128 82, 120 96 Z"
        fill="#F5A300" stroke="#22318F" stroke-width="6" stroke-linejoin="round"/>

  <!-- grip crease shading -->
  <path d="M 96 176 C 90 186, 78 194, 66 194" fill="none" stroke="#22318F" stroke-width="4" stroke-linecap="round" opacity="0.85"/>
  <path d="M 144 176 C 150 186, 162 194, 174 194" fill="none" stroke="#22318F" stroke-width="4" stroke-linecap="round" opacity="0.85"/>

  <!-- D-pad -->
  <g fill="#22318F">
    <rect x="58" y="148" width="32" height="11" rx="3"/>
    <rect x="68" y="138" width="11" height="31" rx="3"/>
  </g>

  <!-- left thumbstick -->
  <circle cx="76" cy="100" r="15" fill="none" stroke="#22318F" stroke-width="6"/>
  <path d="M 85 90 A 11.5 11.5 0 0 1 85 110 A 8 8 0 0 0 85 90 Z" fill="#22318F"/>

  <!-- right thumbstick -->
  <circle cx="130" cy="184" r="18" fill="none" stroke="#22318F" stroke-width="6"/>
  <path d="M 141 173 A 14 14 0 0 1 141 195 A 10 10 0 0 0 141 173 Z" fill="#22318F"/>

  <!-- face buttons -->
  <g fill="none" stroke="#22318F" stroke-width="4.5">
    <circle cx="168" cy="146" r="8"/>
    <circle cx="186" cy="160" r="8"/>
    <circle cx="186" cy="180" r="8"/>
    <circle cx="168" cy="194" r="8"/>
  </g>

  <!-- center small buttons -->
  <g fill="#22318F">
    <circle cx="108" cy="118" r="4"/>
    <circle cx="132" cy="118" r="4"/>
  </g>

  <!-- cap -->
  <g>
    <path d="M 60 92
             C 55 50, 90 18, 132 20
             C 168 22, 196 46, 204 78
             L 172 88
             C 148 78, 118 76, 92 82
             C 80 85, 69 88, 60 92 Z"
          fill="#22318F"/>
    <path d="M 172 88
             C 196 92, 218 96, 236 92
             C 240 91, 240 97, 236 99
             C 214 108, 188 106, 166 98 Z"
          fill="#22318F"/>
    <circle cx="120" cy="19" r="6.5" fill="#22318F"/>
    <g clip-path="url(#plumeCapClip)" stroke="#F5A300" stroke-width="3" fill="none" opacity="0.95">
      <path d="M 72 88 C 76 68, 86 48, 102 34"/>
      <path d="M 86 90 C 90 72, 98 54, 110 40"/>
    </g>
    <circle cx="98" cy="34" r="2.6" fill="#F5A300"/>
    <circle cx="168" cy="48" r="2.6" fill="#F5A300"/>
    <text x="140" y="66" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="46" fill="#F5A300" text-anchor="middle">P</text>
  </g>
</svg>
